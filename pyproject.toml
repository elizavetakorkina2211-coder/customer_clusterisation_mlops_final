[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-mlops"
version = "0.1.0"
description = "MLOps: customer segmentation with drift monitoring and CI/CD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.6",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "mlflow>=2.10.0",
    "joblib>=1.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "prometheus-client>=0.19.0",
    "httpx>=0.26.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
evidently = ["evidently>=0.4.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = ["cookiecutter-mlops"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
