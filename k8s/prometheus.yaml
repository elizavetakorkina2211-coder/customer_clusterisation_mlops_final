apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: segmentation-mlops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: segmentation-mlops
        metrics_path: /metrics
        static_configs:
          - targets:
              - segmentation-api:80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: segmentation-mlops
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: segmentation-mlops
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
