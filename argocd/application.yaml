apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: segmentation-mlops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/elizavetakorkina2211-coder/customer_clusterisation_mlops_final.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: segmentation-mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
