name: CD

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.coords.outputs.image }}
      image_base: ${{ steps.coords.outputs.image_base }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: coords
        run: |
          LOWER="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_BASE=${{ env.REGISTRY }}/$LOWER" >> "$GITHUB_ENV"
          echo "image=${{ env.REGISTRY }}/$LOWER:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_base=${{ env.REGISTRY }}/$LOWER" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}:main
            ${{ env.IMAGE_BASE }}:${{ github.sha }}

  update-manifest:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update manifest with new image tag
        run: |
          sed -i "s|image: ${{ needs.publish.outputs.image_base }}:.*|image: ${{ needs.publish.outputs.image }}|" k8s/deployment.yaml
          if git diff --quiet -- k8s/deployment.yaml; then
            echo "No manifest changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add k8s/deployment.yaml
            git commit -m "chore(cd): update segmentation-api image to ${{ github.sha }} [skip ci]"
            git push origin HEAD:main
          fi
