name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.coords.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: coords
        run: |
          LOWER="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_BASE=${{ env.REGISTRY }}/$LOWER" >> "$GITHUB_ENV"
          echo "image=${{ env.REGISTRY }}/$LOWER:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:main
            ${{ env.IMAGE_BASE }}:${{ github.sha }}

  deploy:
    needs: publish
    if: vars.K8S_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config

      - name: Rollout image
        run: |
          kubectl set image deployment/segmentation-api api="${{ needs.publish.outputs.image }}" -n segmentation-mlops --record
          kubectl rollout status deployment/segmentation-api -n segmentation-mlops --timeout=180s
